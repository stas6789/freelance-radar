# Список публичных Telegram-каналов с заказами/вакансиями.
# Проверены на наличие постов в публичной веб-версии (t.me/s/<name>).
#
# Формат: имя канала (@username). Можно добавлять/убирать свободно —
# изменения подхватятся при следующем запуске.

channels:
  # --- общий поток IT-работ ---
  - "@progjob"              # Работа для программистов (14k subs)
  - "@podrabotka_it"        # Подработка в IT

  # --- Python ---
  - "@pythonrabota"         # Python работа (12k subs)
  - "@p_rabota"             # Python Junior/Middle
  - "@RabotaPython"         # Python Senior/Lead

  # --- Rust ---
  - "@rust_jobs_feed"       # Rust jobs

  # --- Тексты, копирайт ---
  - "@writers_jobs"         # Вакансии для копирайтеров
  - "@rabota_copywriter"    # Работа для копирайтеров
  - "@text_jobs"            # Вакансии для авторов текстов

  # --- Дизайн ---
  - "@design_vacancy"       # Дизайн вакансии
  - "@rabota_design"        # Работа для дизайнеров
