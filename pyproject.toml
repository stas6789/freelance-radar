[project]
name = "freelance-radar"
version = "0.1.0"
description = "Telegram freelance order watcher with LLM-assisted filtering"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
freelance-radar = "freelance_radar.main:main"
